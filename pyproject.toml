[project]
name = "inkwell"
version = "0.1.0"
description = "Self-improving agent template with feedback loop, built with the Claude Agent SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Joy Void Joy", email = "joy.void.joy@gmail.com" }]
keywords = [
    "agent",
    "ai",
    "claude",
    "feedback-loop",
    "llm",
    "self-improving",
    "template",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "arxiv>=4.0.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "linkify-it-py>=2.1.0",
    "lup[claude,codex,docker,web]",
    "markdown-it-py>=4.0.0",
    "markdownify>=1.2.2",
    "matplotlib>=3.11.1",
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
    "pyvirtualdisplay>=3.0",
    "pyyaml>=6.0.3",
    "sh>=2.2.2",
    "syntok>=1.4.4",
    "tqdm>=4.70.0",
    "trafilatura>=2.0.0",
    "typer>=0.21.1",
    "types-pyyaml>=6.0.12.20260815",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
# Where a part-of-speech implementation of the sentence seam would go. Nothing
# installs or imports this: spaCy publishes no wheel for the 3.14 floor this
# project pins, so installing it would mean a source build of Cython, thinc,
# and blis. The declaration records the drop-in point — SpacySegmenter behind
# the same Segmenter seam, with the copula and participial-tail rows reading a
# parse instead of a declared list — for once a wheel exists.
pos = ["spacy>=3.8", "en-core-web-sm"]

# The local implementation behind the CorpusEmbedder seam. Optional by design:
# titles-plus-tags browsing is the primary retrieval mode, and the semantic
# layer reports itself absent rather than failing when it is not installed.
embeddings = ["model2vec>=0.6.0"]

[project.scripts]
inkwell = "inkwell.environment.cli.__main__:app"
inkwell-web = "inkwell.environment.web.__main__:app"
lup-devtools = "inkwell.devtools.main:app"

[project.urls]
Homepage = "https://github.com/joy-void-joy/lup"
Repository = "https://github.com/joy-void-joy/lup"
Issues = "https://github.com/joy-void-joy/lup/issues"

[dependency-groups]
dev = [
    "devtools>=0.12.2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.lup]
agent_version = "0.2.0"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
lup = { git = "https://github.com/joy-void-joy/lup", branch = "dev", subdirectory = "packages/lup" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests requiring external services (Docker, APIs)"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
