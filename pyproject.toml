[project]
name = "inkwell"
version = "0.1.0"
description = "Self-improving agent template with feedback loop, built with the Claude Agent SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Joy Void Joy", email = "joy.void.joy@gmail.com" }]
keywords = [
    "agent",
    "ai",
    "claude",
    "feedback-loop",
    "llm",
    "self-improving",
    "template",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "arxiv>=4.0.0",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "linkify-it-py>=2.1.0",
    "lup[claude,codex,docker,web]",
    "markdown-it-py>=4.0.0",
    "markdownify>=1.2.2",
    "pillow>=12.2.0",
    "playwright>=1.60.0",
    "plotext>=5.3.2",
    "prompt-toolkit>=3.0.52",
    "pydantic-settings>=2.12.0",
    "pymupdf>=1.27.2.3",
    "sh>=2.2.2",
    "trafilatura>=2.0.0",
    "typer>=0.21.1",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
inkwell = "inkwell.environment.cli.__main__:app"
inkwell-web = "inkwell.environment.web.__main__:app"
lup-devtools = "inkwell.devtools.main:app"

[project.urls]
Homepage = "https://github.com/joy-void-joy/lup"
Repository = "https://github.com/joy-void-joy/lup"
Issues = "https://github.com/joy-void-joy/lup/issues"

[dependency-groups]
dev = [
    "devtools>=0.12.2",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.lup]
agent_version = "0.2.0"

[tool.uv.sources]
lup = { git = "https://github.com/joy-void-joy/lup", branch = "dev", subdirectory = "packages/lup" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: tests requiring external services (Docker, APIs)"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
